version: '3.9'

services:
  backend:
    image: bhadri2919/trocare-backend:v1
    build: .
    container_name: rag_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: always
    depends_on:
      - mysql

  mysql:
    image: mysql:8
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: Bhadri_2919
      MYSQL_DATABASE: trocare_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always

volumes:
  mysql_data:
